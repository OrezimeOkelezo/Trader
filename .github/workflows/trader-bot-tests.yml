name: Trader paper engine tests

on:
  push:
    paths:
      - "bot/**"
      - ".github/workflows/trader-bot-tests.yml"
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/trader-bot-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - run: pip install -e "bot/.[dev]"
      - run: pytest -q bot/tests
        env:
          PYTHONPATH: bot
